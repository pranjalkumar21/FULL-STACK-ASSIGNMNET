<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Concentric Circles</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:Arial}
.circles{width:60px;height:60px;border-radius:50%;background:#ef4444;display:grid;place-items:center}
.middle{width:40px;height:40px;border-radius:50%;background:#facc15;display:grid;place-items:center}
.inner{width:20px;height:20px;border-radius:50%;background:#2563eb}
</style></head>
<body><div class="circles"><div class="middle"><div class="inner"></div></div></div></body></html>

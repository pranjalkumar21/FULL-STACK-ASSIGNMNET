<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten Cards</title><style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;padding:28px;background:#f1f5f9}
.cards{display:flex;gap:16px;overflow-x:auto;padding:8px 4px 20px}
.card{flex:0 0 220px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #0001}
.card img{width:100%;height:135px;object-fit:cover;display:block}.content{padding:14px}
h2{font-size:18px;margin:0 0 8px}.content p{margin:0;color:#475569;line-height:1.45}
</style></head><body><h1>Our Gallery</h1><div class="cards" id="cards"></div>
<script>
const cards=document.getElementById('cards');
for(let i=1;i<=10;i++){
 const article=document.createElement('article');article.className='card';
 article.innerHTML=`<img src="https://picsum.photos/seed/card${i}/440/270" alt="Gallery image ${i}">
 <div class="content"><h2>Card ${i}</h2><p>This is a short description for card number ${i}. Explore the image and learn something new.</p></div>`;
 cards.appendChild(article);
}
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do List</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:30px}.app{max-width:650px;margin:auto;background:white;padding:24px;border-radius:14px;box-shadow:0 8px 25px #0001}
form{display:flex;gap:8px}input[type=text]{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:7px}
button{border:0;padding:9px 12px;border-radius:7px;background:#4f46e5;color:white;cursor:pointer;margin:2px}
li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e2e8f0}.task{flex:1}.done{text-decoration:line-through;color:#64748b}
.actions button{background:#475569}.actions .delete{background:#dc2626}
</style></head><body><main class="app"><h1>My To-Do List</h1>
<form id="taskForm"><input id="taskInput" type="text" placeholder="Enter a task" required><button>Add</button></form><ul id="taskList"></ul></main>
<script>
const form=document.getElementById('taskForm'),input=document.getElementById('taskInput'),list=document.getElementById('taskList');
let tasks=[];
function render(){
 list.innerHTML='';
 tasks.forEach((task,index)=>{
  const li=document.createElement('li');
  const check=document.createElement('input');check.type='checkbox';check.checked=task.done;
  check.addEventListener('change',()=>{tasks[index].done=check.checked;render()});
  const label=document.createElement('span');label.className='task'+(task.done?' done':'');label.textContent=task.text;
  const actions=document.createElement('span');actions.className='actions';
  const up=document.createElement('button');up.textContent='↑';up.title='Move up';up.disabled=index===0;
  up.onclick=()=>{[tasks[index-1],tasks[index]]=[tasks[index],tasks[index-1]];render()};
  const down=document.createElement('button');down.textContent='↓';down.title='Move down';down.disabled=index===tasks.length-1;
  down.onclick=()=>{[tasks[index+1],tasks[index]]=[tasks[index],tasks[index+1]];render()};
  const del=document.createElement('button');del.textContent='Delete';del.className='delete';del.onclick=()=>{tasks.splice(index,1);render()};
  actions.append(up,down,del);li.append(check,label,actions);list.appendChild(li);
 });
}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(text){tasks.push({text,done:false});input.value='';render()}});
</script></body></html>

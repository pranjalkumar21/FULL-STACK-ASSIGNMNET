<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chessboard</title>
<style>body{font-family:Arial;text-align:center;background:#f8fafc}.board{display:grid;grid-template-columns:repeat(8, min(10vw,64px));width:max-content;margin:25px auto;border:5px solid #334155}.square{width:min(10vw,64px);height:min(10vw,64px);display:grid;place-items:center;font-size:clamp(20px,5vw,42px)}.light{background:#f0d9b5}.dark{background:#b58863}</style></head>
<body><h1>Chessboard</h1><div id="board" class="board" aria-label="Chessboard"></div>
<script>
const board=document.getElementById('board');
const pieces=[
 ['♜','♞','♝','♛','♚','♝','♞','♜'],
 ['♟','♟','♟','♟','♟','♟','♟','♟'],
 ...Array.from({length:4},()=>Array(8).fill('')),
 ['♙','♙','♙','♙','♙','♙','♙','♙'],
 ['♖','♘','♗','♕','♔','♗','♘','♖']
];
for(let row=0;row<8;row++)for(let col=0;col<8;col++){
 const square=document.createElement('div');square.className='square '+((row+col)%2===0?'light':'dark');
 square.textContent=pieces[row][col];square.dataset.position=`${row+1},${col+1}`;board.appendChild(square);
}
</script></body></html>

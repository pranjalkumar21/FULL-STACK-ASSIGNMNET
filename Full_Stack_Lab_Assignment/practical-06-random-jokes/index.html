<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Jokes</title>
<style>body{font-family:Arial;background:#e0f2fe;min-height:100vh;display:grid;place-items:center;margin:0}.box{max-width:520px;margin:20px;background:white;padding:30px;border-radius:16px;text-align:center;box-shadow:0 8px 24px #0002}button{padding:12px 18px;border:0;border-radius:8px;background:#0369a1;color:white;cursor:pointer}</style></head>
<body><main class="box"><h1>😂 Random Joke Generator</h1><p id="joke">Click the button to get a joke.</p><button id="getJoke">Get a Joke</button></main>
<script>
const joke=document.getElementById('joke'),button=document.getElementById('getJoke');
button.onclick=async()=>{
 joke.textContent='Loading...';button.disabled=true;
 try{const response=await fetch('https://official-joke-api.appspot.com/random_joke');if(!response.ok)throw new Error('Request failed');
 const data=await response.json();joke.textContent=data.setup+' — '+data.punchline;
 }catch(error){joke.textContent='Could not load a joke. Please check your internet connection and try again.'}
 finally{button.disabled=false}
};
</script></body></html>

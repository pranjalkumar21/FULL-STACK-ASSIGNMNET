<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Dashboard</title><style>
body{font-family:Arial;max-width:850px;margin:30px auto;padding:0 16px;background:#f8fafc}form,.product{background:white;padding:15px;margin:12px 0;border-radius:9px}input,button{padding:10px;margin:5px;border:1px solid #cbd5e1;border-radius:6px}button{background:#2563eb;color:white;border:0}
</style></head><body><h1>Product Dashboard</h1><form id="form"><h2>Add Product</h2><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" placeholder="Price" required><input id="rating" type="number" min="0" max="5" step=".1" placeholder="Rating" required><button>Add Product</button></form><h2>All Products</h2><div id="products"></div>
<script>
const container=document.getElementById('products');
async function loadProducts(){const res=await fetch('/api/products');const products=await res.json();container.innerHTML='';
 products.forEach(p=>{const card=document.createElement('article');card.className='product';card.innerHTML=`<h3>${escapeHtml(p.name)}</h3><p>ID: ${p.id}</p><p>Price: ₹${p.price}</p><p>Rating: ${p.rating}/5</p>`;container.appendChild(card)});
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const product={name:document.getElementById('name').value,price:document.getElementById('price').value,rating:document.getElementById('rating').value};
 const res=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(product)});
 if(res.ok){e.target.reset();loadProducts()}else alert('Could not add product');
};loadProducts();
</script></body></html>
